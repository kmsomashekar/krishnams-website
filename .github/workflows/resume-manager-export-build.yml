name: Resume Manager Export Build

on:
  push:
    branches:
      - fix/preserve-master-docx-template
  pull_request:
    paths:
      - "resume-manager/frontend/**"
      - ".github/workflows/resume-manager-export-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-manager/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: resume-manager/frontend/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run frontend tests
        run: npm test
