name: Resume Manager Export Build

on:
  push:
    branches:
      - fix/preserve-master-docx-template
  pull_request:
    paths:
      - "resume-manager/frontend/**"
      - ".github/workflows/resume-manager-export-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-manager/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: resume-manager/frontend/package-lock.json
      - name: Install dependencies and reconcile lockfile
        run: npm install
      - name: Refresh lockfile
        run: npm install --package-lock-only
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Update frontend dependency lockfile"
            git push
          fi
      - name: Build frontend
        run: npm run build
      - name: Run frontend tests
        run: npm test
      - name: Upload refreshed package lock
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: resume-manager/frontend/package-lock.json
